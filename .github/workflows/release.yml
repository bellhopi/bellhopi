name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.goos }} / ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-24.04, exe: ''}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, exe: ''}
          - {goos: darwin, goarch: amd64, runner: macos-15-intel, exe: ''}
          - {goos: darwin, goarch: arm64, runner: macos-15, exe: ''}
          - {goos: windows, goarch: amd64, runner: windows-2025, exe: '.exe'}
          - {goos: windows, goarch: arm64, runner: windows-11-arm, exe: '.exe'}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Check native target
        run: |
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"
      - name: Test and vet
        run: |
          go test ./... -count=1 -timeout=90s
          go vet ./...
      - name: Race detector
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -race ./... -count=1 -timeout=90s
      - name: Build standalone executable
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o 'bin/concierge-dialer${{ matrix.exe }}' ./cmd/concierge-dialer
      - name: Package and smoke-test installation
        run: python scripts/package_release.py --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/bellhopi_*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Verify the complete release set
        working-directory: dist
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', version)
          expected = {f'bellhopi_{version}_{system}_{arch}' + ('.zip' if system == 'windows' else '.tar.gz') for system in ['darwin', 'linux', 'windows'] for arch in ['amd64', 'arm64']}
          assert {p.name for p in pathlib.Path('.').glob('*.sha256')} == {name + '.sha256' for name in expected}
          assert all(pathlib.Path(name).is_file() for name in expected)
          PY
          sha256sum --check *.sha256
          cat *.sha256 > SHA256SUMS
      - name: Publish verified archives
        run: |
          cat > release-notes.md <<'EOF'
          Prebuilt Bellhopi packages for macOS, Linux, and Windows, on x64/Intel (`amd64`) and ARM64. Each archive includes the executable, the Codex/Claude Code skill, MIT license, dependency notices, setup instructions, and build metadata.

          Extract the archive for your platform and run `./bin/concierge-dialer install --target both --source skills/concierge-dialer` from the extracted folder. On Windows, use `.\bin\concierge-dialer.exe`.

          Native tests, vet, and package installation smoke checks must pass on all six platforms before this release is published. Linux x64 also runs the race detector. Verify downloads with SHA256SUMS.

          Binaries are not signed with Apple Developer ID or Windows Authenticode certificates. Real Telnyx/OpenAI calls and IVR acceptance remain unverified; configure your own accounts and HTTPS/WSS endpoint before a live call.
          EOF
          gh release create "$RELEASE_VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Bellhopi $RELEASE_VERSION" --notes-file release-notes.md
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
